:root{--ch:#2B2B2B;--cel:#E6EAE3}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:#F4F4F2;color:var(--ch)}
.lang button{color:rgba(230,234,227,.6)}.lang button[aria-pressed=true]{color:#E6EAE3;border-bottom-color:#E6EAE3}
/* barra fija: identidad siempre presente */
.bar{position:sticky;top:0;z-index:5;background:#2B2B2B;color:var(--cel);display:flex;align-items:center;gap:14px;padding:10px 20px;height:64px}
.bar .seal{width:44px;height:44px;flex:none}
.bar .nm{line-height:1.25}
.bar .nm b{display:block;font-size:13px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.bar .nm span{font-size:10px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:rgba(230,234,227,.6)}
.bar .sp{flex:1}
.views{display:flex;gap:2px;border:1px solid rgba(230,234,227,.28);border-radius:99px;padding:2px}
.views button{font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;padding:7px 12px;border-radius:99px;color:rgba(230,234,227,.7)}
.views button[aria-pressed=true]{background:var(--cel);color:var(--ch)}
.bar .lang{margin-left:6px}
/* portada del portafolio */
.top0{background:linear-gradient(180deg,#2B2B2B 0%,#34454A 50%,#7E9692 82%,#BED2C3 100%);color:var(--cel);position:relative;overflow:hidden;padding:56px 28px 64px}
.top0 .in{max-width:1240px;margin:0 auto;position:relative;z-index:1}
.top0 .iso{position:absolute;right:-40px;top:-30px;width:420px;height:420px;color:var(--cel);opacity:.07;pointer-events:none}
.back{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:rgba(230,234,227,.85)}
h1.t{font-size:clamp(52px,9vw,112px);font-weight:300;letter-spacing:-.025em;line-height:1;margin-top:34px}
.who{margin-top:18px;font-size:12px;font-weight:500;letter-spacing:.28em;text-transform:uppercase}
.sub{margin-top:8px;font-size:14px;font-weight:300;color:rgba(230,234,227,.75)}
/* páginas */
#pages{max-width:1360px;margin:0 auto;padding:36px 20px 20px;display:flex;flex-direction:column;gap:28px}
.pgf{position:relative;margin:0;cursor:zoom-in}
.pimg{position:relative;aspect-ratio:var(--r,1.6);background:#FDFCF8;box-shadow:0 1px 2px rgba(43,43,43,.08),0 18px 40px -22px rgba(43,43,43,.35);overflow:hidden;display:flex;align-items:center;justify-content:center}
.pimg>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;pointer-events:none}
.pimg .ph{font-size:11px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:#7C8785}
/* marca de agua: una sola firma discreta, sin mosaico sobre la imagen */
.wm{position:absolute;left:0;right:0;bottom:1.6%;text-align:center;font-size:clamp(7px,.85vw,11px);font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:rgba(43,43,43,.22);pointer-events:none;mix-blend-mode:multiply}
.cap2{display:flex;justify-content:space-between;margin-top:10px;font-size:10.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#5C676E}
/* vista índice */
body.v-grid #pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,480px),1fr));gap:34px 28px}
/* vista presentación */
body.v-slide{background:#2B2B2B;overflow:hidden}
body.v-slide .top0,body.v-slide .close{display:none}
body.v-slide #pages{max-width:none;height:calc(100svh - 64px);padding:20px 70px 54px;display:block;position:relative}
body.v-slide .pgf{display:none;height:100%;cursor:default}
body.v-slide .pgf.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
body.v-slide .pimg{aspect-ratio:var(--r,1.6);max-width:100%;max-height:calc(100% - 30px);width:min(100%,calc((100svh - 64px - 124px)*var(--r,1.6)))}
body.v-slide .cap2{width:min(100%,calc((100svh - 64px - 124px)*var(--r,1.6)));color:rgba(230,234,227,.7)}
.snav{display:none}
body.v-slide .snav{display:flex;position:fixed;top:50%;width:100%;justify-content:space-between;padding:0 10px;pointer-events:none;transform:translateY(-50%)}
.snav button{pointer-events:auto;width:48px;height:48px;font-size:30px;font-weight:300;color:var(--cel)}
/* cierre con identidad */
.close{background:var(--g);color:#1E1E1E;margin-top:40px;padding:72px 28px 64px}
.close .in{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:36px 56px;align-items:center}
.close .seal{width:150px;height:150px}
.close h2{font-size:clamp(34px,5vw,56px);font-weight:300;letter-spacing:-.02em;line-height:1.05;color:var(--ch)}
.close p{margin-top:10px;font-size:15px;font-weight:300}
.close a{display:inline-block;margin-top:6px;font-size:20px;font-weight:500;border-bottom:1px solid rgba(43,43,43,.5)}
.close .cap{margin-top:30px;color:#2F3B3A}
@media(max-width:700px){
 .bar{padding:8px 14px;gap:10px;flex-wrap:nowrap}.bar .nm span{display:none}.bar .nm b{font-size:11px;letter-spacing:.16em}
 .views button{padding:7px 9px;font-size:9px;letter-spacing:.1em}
 .top0{padding:40px 20px 48px}.top0 .iso{width:280px;height:280px}
 #pages{padding:22px 10px 10px;gap:20px}
 body.v-slide #pages{padding:12px 10px 54px}
 body.v-slide .snav{display:none}
 .close .in{grid-template-columns:1fr}.close .seal{width:110px;height:110px}
}
/* visor ampliado */
.lb{position:fixed;inset:0;background:rgba(30,30,30,.97);display:none;align-items:center;justify-content:center;z-index:10;padding:0}
.lb.on{display:flex}
.lb .pg{position:relative;width:100vw;height:100svh;display:flex;align-items:center;justify-content:center;padding:56px 8px}
.lb .pg .pimg{width:min(100%,calc((100svh - 112px)*var(--r,1.6)));max-height:100%;box-shadow:none}
.lb.rot .pg .pimg{transform:rotate(90deg);width:calc(100svh - 24px);flex:none;max-width:none}
.lb .x,.lb .pv,.lb .nx,.lb .rt{position:absolute;font-size:28px;font-weight:300;width:52px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--cel);z-index:2}
.lb .x{top:4px;right:4px}.lb .pv{left:2px;top:50%;margin-top:-26px}.lb .nx{right:2px;top:50%;margin-top:-26px}
.lb .rt{top:4px;right:56px;font-size:22px;display:none}
@media(max-width:700px) and (orientation:portrait){.lb .rt{display:flex}}
.lb .cnt{position:absolute;top:20px;left:20px;font-size:11px;letter-spacing:.22em;color:rgba(230,234,227,.85);z-index:2}
html:not([lang=en]) .en{display:none}html[lang=en] .es{display:none}html:not([lang=it]) .it{display:none}html[lang=it] .es,html[lang=it] .en{display:none}
.sf{position:absolute;left:0;top:0;width:1600px;height:1000px;transform-origin:0 0;transform:scale(var(--k,.25));pointer-events:none}
.pimg>img{opacity:0}.pimg.hasimg>img{opacity:1}.pimg.hasimg .sf{display:none}

<p class="p1"><span class="es">Diseñadora industrial y de producto con dos maestrías: Diseño de Producto (Scuola Politecnica di Design, Milán) y Modelado de Producto Digital (ESDesign, Barcelona).</span><span class="en">Industrial and product designer with two master’s degrees: Product Design (Scuola Politecnica di Design, Milan) and Digital Product Modelling (ESDesign, Barcelona).</span><span class="it">Designer industriale e di prodotto con due master: Design di Prodotto (Scuola Politecnica di Design, Milano) e Modellazione Digitale di Prodotto (ESDesign, Barcellona).</span></p>
<p class="p1"><span class="es">En Studio Fuksas (Roma), responsable del desarrollo digital del área de diseño en productos hoy comercializados y presentados en la Milan Design Week. Actualmente, fundadora y directora de Zhezu Studio 3D, estudio de diseño y fabricación digital en Bogotá.</span><span class="en">At Studio Fuksas (Rome), led digital development for the design department on products now on the market and exhibited at Milan Design Week. Currently founder and director of Zhezu Studio 3D, a design and digital fabrication studio in Bogotá.</span><span class="it">Presso Studio Fuksas (Roma), responsabile dello sviluppo digitale dell’area design su prodotti oggi in commercio e presentati alla Milano Design Week. Attualmente fondatrice e direttrice di Zhezu Studio 3D, studio di design e fabbricazione digitale a Bogotá.</span></p>
<p class="p1"><span class="es">Especialización en modelado 3D de precisión, visualización, prototipado y moldes, con criterios de fabricación desde la primera etapa del diseño.</span><span class="en">Specialised in precision 3D modelling, visualisation, prototyping and mould-making, with manufacturing criteria applied from the earliest design stage.</span><span class="it">Specializzata in modellazione 3D di precisione, visualizzazione, prototipazione e stampi, con criteri di fabbricazione applicati fin dalle prime fasi del progetto.</span></p>

">Un’unica lampada che regola la luce in base all’attività, secondo il principio di funzionamento di un diaframma fotografico.</span></p></div><figure class="fg" style="left:80px;top:358px;width:327px"><img src="img/pf/dia-dev-1.jpg" alt="" style="height:426px"><figcaption style="height:117px"><b>01</b><span class="es">Primer concepto: cono con fuelle tipo acordeón. Descartado por reducir en un 60 % la vida útil del material; se conservó el concepto y se rediseñó el mecanismo.</span><span class="en">First concept: a cone with accordion bellows. Discarded for reducing material life by 60 %; the concept was retained and the mechanism redesigned.</span><span class="it">Primo concept: cono con soffietto a fisarmonica. Scartato perché riduceva del 60 % la vita utile del materiale; il concept è stato mantenuto e il meccanismo riprogettato.</span></figcaption></figure><figure class="fg" style="left:431px;top:358px;width:735px"><img src="img/pf/dia-dev-2.jpg" alt="" style="height:426px"><figcaption style="height:117px"><b>02</b><span class="es">Diafragma de seis aspas: el giro del cabezal regula la apertura, de luz difusa a luz directa, sin componentes sujetos a desgaste.</span><span class="en">Six-blade aperture: rotating the head regulates the opening, from diffused to direct light, with no wear-prone components.</span><span class="it">Diaframma a sei lamelle: la rotazione della testa regola l’apertura, da luce diffusa a luce diretta, senza componenti soggetti a usura.</span></figcaption></figure><figure class="fg" style="left:1189px;top:358px;width:331px"><img src="img/pf/dia-dev-3.jpg" alt="" style="height:426px"><figcaption style="height:117px"><b>03</b><span class="es">Articulaciones con topes internos: rotación de 300° vertical y 130° horizontal, con iluminación indirecta hacia el techo.</span><span class="en">Joints with internal stops: 300° vertical and 130° horizontal rotation, enabling indirect light towards the ceiling.</span><span class="it">Snodi con arresti interni: rotazione di 300° in verticale e 130° in orizzontale, con luce indiretta verso il soffitto.</span></figcaption></figure><div class="ft"><span>Angie Uesseler Cala</span><span>13</span></div></section><section class="sl"><div class="band g grain" style="top:250px"></div><div class="hd" style="left:80px;right:80px"><span>04 — <span class="es">DIAFRAMMA LAMP 1.6</span><span class="en">DIAFRAMMA LAMP 1.6</span><span class="it">DIAFRAMMA LAMP 1.6</span></span><span><span class="es">Proceso</span><span class="en">Process</span><span class="it">Processo</span></span></div><figure class="fg" style="left:80px;top:383px;width:498px"><img src="img/pf/dia-pr-1.jpg" alt="" style="height:406px"><figcaption style="height:41px"><span class="es">Bocetos de exploración: forma, color y mecanismo</span><span class="en">Exploration sketches: form, colour and mechanism</span><span class="it">Schizzi esplorativi: forma, colore e meccanismo</span></figcaption></figure><figure class="fg" style="left:602px;top:383px;width:599px"><img src="img/pf/dia-pr-2.jpg" alt="" style="height:406px"><figcaption style="height:41px"><span class="es">Prototipo funcional: electrónica integrada en la base</span><span class="en">Working prototype: electronics integrated into the base</span><span class="it">Prototipo funzionante: elettronica integrata nella base</span></figcaption></figure><figure class="fg" style="left:1225px;top:383px;width:295px"><img src="img/pf/dia-pr-3.jpg" alt="" style="height:406px"><figcaption style="height:41px"><span class="es">Base táctil con carga inalámbrica</span><span class="en">Touch base with wireless charging</span><span class="it">Base touch con ricarica wireless</span></figcaption></figure><div class="ft"><span>Angie Uesseler Cala</span><span>14</span></div></section><section class="sl"><div class="gp g grain" style="width:1060px"></div>

e</span><span class="en">Packaging with assembly instructions</span><span class="it">Packaging con istruzioni di montaggio</span></figcaption></figure><figure class="fg" style="left:1225px;top:428px;width:295px"><img src="img/pf/dia-award.jpg" alt="" style="height:325px"><figcaption style="height:60px"><span class="es">Entrega del premio · Isola Design Awards 2021</span><span class="en">Award ceremony · Isola Design Awards 2021</span><span class="it">Premiazione · Isola Design Awards 2021</span></figcaption></figure><div class="ft"><span>Angie Uesseler Cala</span><span>15</span></div></section><section class="sl"><div class="gp g grain" style="width:1000px"></div><img class="ph" src="img/pf/skate.jpg" alt="" style="left:640px;top:225px;width:880px;height:550px"><div class="tx" style="left:80px;width:480px"><div class="hd" style="left:0px;right:80px"><span>05 — <span class="es">INLINE SKATE</span><span class="en">INLINE SKATE</span><span class="it">INLINE SKATE</span></span><span></span></div>
<div class="pn0">05 / 07</div><h2 class="nw"><span class="es">INLINE SKATE</span><span class="en">INLINE SKATE</span><span class="it">INLINE SKATE</span></h2><p class="p2"><span class="es">Patín de velocidad diseñado para maximizar la transmisión de potencia con menor esfuerzo.</span><span class="en">A speed skate designed to maximise power transfer with less effort.</span><span class="it">Pattino da velocità progettato per massimizzare la trasmissione di potenza con meno sforzo.</span></p><div class="meta"><div class="mr"><span class="cp"><span class="es">Tipo</span><span class="en">Type</span><span class="it">Tipo</span></span><span class="v"><span class="es">Proyecto de autor · deporte y calzado</span><span class="en">Personal project · sport & footwear</span><span class="it">Progetto personale · sport e calzature</span></span></div><div class="mr"><span class="cp"><span class="es">Duración</span><span class="en">Duration</span><span class="it">Durata</span></span><span class="v"><span class="es">1 mes</span><span class="en">1 month</span><span class="it">1 mese</span></span></div><div class="mr"><span class="cp"><span class="es">Mi rol</span><span class="en">My role</span><span class="it">Il mio ruolo</span></span><span class="v"><span class="es">Investigación, bocetos, concepto, modelado 3D y visualización</span><span class="en">Research, sketches, concept, 3D modelling and visualisation</span><span class="it">Ricerca, schizzi, concept, modellazione 3D e visualizzazione</span></span></div><div class="mr"><span class="cp"><span class="es">Estado</span><span class="en">Status</span><span class="it">Stato</span></span><span class="v"><span class="es">Concepto</span><span class="en">Concept</span><span class="it">Concept</span></span></div></div>
<div class="tg"><span class="es">Concepto</span><span class="en">Concept</span><span class="it">Concept</span></div></div><div class="ft"><span>Angie Uesseler Cala</span><span>16</span></div></section><section class="sl"><div class="band g grain" style="top:330px"></div><div class="hd" style="left:80px;right:80px"><span>05 — <span class="es">INLINE SKATE</span><span class="en">INLINE SKATE</span><span class="it">INLINE SKATE</span></span><span><span class="es">Desarrollo</span><span class="en">Development</span><span class="it">Sviluppo</span></span></div><div class="rd" style="left:80px;width:680px;top:128px"><span class="cp"><span class="es">El reto</span><span class="en">The challenge</span><span class="it">La sfida</span></span><p><span class="es">Los patines de velocidad convencionales priorizan la rigidez en detrimento de la comodidad y el soporte del tobillo. El proyecto propone una bota ligera y ergonómica que mantiene una transmisión de potencia eficiente durante la aceleración.</span><span class="en">Conventional speed skates prioritise stiffness at the expense of comfort and ankle support. The project proposes a lightweight, ergonomic boot that maintains efficient power transfer under acceleration.</span><span class="it">I pattini da velocità tradizionali privilegiano la rigidità a scapito di comfort e sostegno della caviglia. Il progetto propone una scarpetta leggera ed ergonomica che mantiene un’efficiente trasmissione di potenza in accelerazione.</span></p></div><div class="rd" style="left:840px;width:680px;top:128px"><span class="cp"><span class="es">La idea</span><span class="en">The idea</span><span class="it">L’idea</span></span><p><span class="es">Bota de caña baja y chasis aligerado con absorción de vibraciones.</span><span class="en">Low-cut boot and lightweight chassis with vibration damping.</span><span class="it">Scarpetta bassa e telaio alleggerito con assorbimento delle vibrazioni.</span></p></div><figure class="fg" style="left:80px;top:442px;width:633px"><img src="img/pf/skate-dev-1.jpg" alt="" style="height:309px"><figcaption style="height:98px"><b>01</b><span class="es">Bocetos de bota y chasis.</span><span class="en">Boot and chassis sketches.</span><span class="it">Schizzi della scarpetta e del telaio.</span></figcaption></figure><figure class="fg" style="left:737px;top:442px;width:508px"><img src="img/pf/skate-dev-2.jpg" alt="" style="height:309px"><figcaption style="height:98px"><b>02</b><span class="es">Del boceto al modelo: definición de proporciones de la bota sobre el chasis.</span><span class="en">From sketch to model: defining the boot’s proportions on the chassis.</span><span class="it">Dallo schizzo al modello: definizione delle proporzioni della scarpetta sul telaio.</span></figcaption></figure><figure class="fg" style="left:1269px;top:442px;width:251px"><img src="img/pf/skate-dev-3.jpg" alt="" style="height:309px"><figcaption style="height:98px"><b>03</b><span class="es">Chasis en aluminio serie 7000, ruedas de 100 mm, tornillería y ajuste del empeine.</span><span class="en">7000-series aluminium chassis, 100 mm wheels, hardware and instep adjustment.</span><span class="it">Telaio in alluminio serie 7000, ruote da 100 mm, minuteria e regolazione del collo del piede.</span></figcaption></figure><div class="ft"><span>Angie Uesseler Cala</span><span>17</span></div></section><section class="sl"><div class="gp g grain" style="width:1060px"></div>
<div class="tx" style="left:80px;width:400px"><div class="hd" style="left:0;right:0"><span>05 — <span class="es">INLINE SKATE</span><span class="en">INLINE SKATE</span><span class="it">INLINE SKATE</span></span></div><h2 class="sm"><span class="es">RESULTADO</span><span class="en">OUTCOME</span><span class="it">RISULTATO</span></h2><p class="p2" style="top:250px"><span class="es">Chasis en aluminio serie 7000, aligerado mediante vaciados y reforzado en tres niveles internos para garantizar su estabilidad estructural. Variantes de color para distintos perfiles de usuario.</span><span class="en">A 7000-series aluminium chassis, lightened with cut-outs and reinforced on three internal levels to ensure structural stability. Colourways for different user profiles.</span><span class="it">Telaio in alluminio serie 7000, alleggerito con svuotamenti e rinforzato su tre livelli interni per garantire la stabilità strutturale. Varianti di colore per diversi profili di utente.</span></p></div><figure class="fg" style="left:590px;top:167px;width:178px"><img src="img/pf/skate-res-1.jpg" alt="" style="height:230px"></figure><figure class="fg" style="left:792px;top:167px;width:139px"><img src="img/pf/skate-res-2.jpg" alt="" style="height:230px"></figure><figure class="fg" style="left:955px;top:167px;width:565px"><img src="img/pf/skate-res-3.jpg" alt="" style="height:230px"></figure><figure class="fg" style="left:590px;top:421px;width:930px"><img src="img/pf/skate-res-4.jpg" alt="" style="height:412px"></figure><div class="ft"><span>Angie Uesseler Cala</span><span>18</span></div></section><section class="sl"><div class="gp l g grain" style="width:640px"></div><img class="ph" src="img/pf/ct.jpg" alt="" style="left:60px;top:170px;width:520px;height:660px"><div class="tx" style="left:720px;width:800px"><div class="hd" style="left:0px;right:80px"><span>06 — <span class="es">CT-SET</span><span class="en">CT-SET</span><span class="it">CT-SET</span></span><span><span class="es">Set de café document.getElementById("lb").addEventListener("click",function(e){if(e.target.id==="lb"||e.target.id==="pg")closeLb()});
document.getElementById("sp").onclick=function(){go(-1)};document.getElementById("sn").onclick=function(){go(1)};
document.addEventListener("keydown",function(e){var on=document.getElementById("lb").classList.contains("on");
if(on){if(e.key==="Escape")closeLb();if(e.key==="ArrowLeft")stepLb(-1);if(e.key==="ArrowRight")stepLb(1)}
else if(mode==="slide"){if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight"||e.key===" ")go(1)}});
var tx=null;document.addEventListener("touchstart",function(e){tx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",function(e){if(tx===null)return;var d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)<50)return;var on=document.getElementById("lb").classList.contains("on");if(on)stepLb(d<0?1:-1);else if(mode==="slide")go(d<0?1:-1)});
document.querySelectorAll("#views button").forEach(function(b){b.addEventListener("click",function(){setMode(b.dataset.v)})});

})();
